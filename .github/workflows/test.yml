name: Test the action
on:
  push:
    branches:
    - "v*"
  pull_request:
    branches:
    - "*"
defaults:
  run:
    shell: bash

jobs:
  verify-index-js-up-to-date:
    name: Verify that `dist/index.js` is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: diff-ing dist/index.js
        run: |
          set -euxo pipefail
          npm ci
          npm run build
          # exclude dist/index.js.map (different on Windows)
          git diff --stat --exit-code HEAD -- ':!dist/index.js.map'

  verify-dmd:
    needs: verify-index-js-up-to-date
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        dc: [
            dmd,
            dmd-2.099.1,
            dmd-2.108.1-rc.1,
            dmd-2.106,
            dmd-2.106b,
            dmd-latest,
            dmd-beta,
            dmd^3,
            dmd-master,
        ]
        include:
          # https://github.com/dlang/dmd/issues/21126
          - { os: macOS-latest, dc: dmd-master }
          # Needs >=dmd-2.107.1 due to https://issues.dlang.org/show_bug.cgi?id=24137
          - { os: macOS-14, dc: dmd-2.108.1-rc.1 }
          - { os: macOS-14, dc: dmd-2.109 }
          - { os: macOS-14, dc: dmd-latest }
          - { os: macOS-14, dc: dmd-master }
          - { os: macOS-13, dc: dmd-2.108.1-rc.1 }
          - { os: macOS-13, dc: dmd-2.107 }
          - { os: macOS-13, dc: dmd-latest }
          - { os: macOS-13, dc: dmd-master }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-d-compiler
        with:
          dc: ${{ matrix.dc }}

  verify-ldc:
    needs: verify-index-js-up-to-date
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-14, macOS-13 ]
        dc: [
            ldc,
            ldc-1.37.0-beta1,
            ldc-1.36,
            ldc-1.38b,
            ldc-latest,
            ldc-beta,
            ldc^3,
            ldc-master,
        ]
        include:
          # arm64 binaries are available since ldc-1.25.0
          - { os: macOS-13, dc: ldc-1.19.0 }

          - { os: macOS-latest, dc: ldc }
          - { os: macOS-latest, dc: ldc-beta }
          - { os: macOS-latest, dc: ldc-master }
          - { os: macOS-latest, dc: ldc-1.41.0 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-d-compiler
        with:
          dc: ${{ matrix.dc }}

  verify-gdc:
    needs: verify-index-js-up-to-date
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        dc: [ gdc, gdc-12 ]
        gdmd_sha: [ latest, 27c4c660f30d03e6cf467781bbbd3bbcc3db5758 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-d-compiler
        with:
          dc: ${{ matrix.dc }}
          gdmd_sha: ${{ matrix.gdmd_sha }}
      - name: Test that dub is installed by default
        run: |
          cd .github && dub run --single hello.d

  verify-default:
    needs: verify-index-js-up-to-date
    name: Verify default compiler
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest, macOS-13 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-d-compiler

  verify-sig:
    needs: verify-index-js-up-to-date
    name: Check verify_sig input
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        verify_sig: [ true, false ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-d-compiler
        with:
          verify_sig: ${{ matrix.verify_sig }}

  dub:
    name: Verify standalone DUB install
    needs: verify-index-js-up-to-date
    strategy:
      fail-fast: false
      matrix:
        os:  [ ubuntu-latest, windows-latest, macOS-14, macOS-13 ]
        dc:  [ ldc-latest, dmd-latest ]
        dub: [ 1.19.0, any, latest ]
        include:
          - { os: ubuntu-latest, dub: 1.19.0, dc: gdc }
          - { os: ubuntu-latest, dub: any,    dc: gdc-12 }
          - { os: ubuntu-latest, dub: latest, dc: gdc }
          - { os: ubuntu-latest, dub: latest, dc: gdc-12 }

          - { os: macos-latest, dub: any,    dc: dmd-master }
          - { os: macos-latest, dub: latest, dc: ldc }
          - { os: macos-latest, dub: 1.40.0, dc: ldc-beta }
        exclude:
          # Excluded because those are actually Linux executables
          - { os: windows-latest, dub: 1.19.0 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install D compiler
        uses: ./
        with:
          compiler: ${{ matrix.dc }}
          dub: ${{ matrix.dub }}

      - name: Verify DUB version
        if: matrix.dub != 'any'
        run: |
          if [[ ${{ matrix.dub }} == 'latest' ]]
          then
              curlCmd=(
                  curl -s
                  --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
                  https://api.github.com/repos/dlang/dub/releases/latest
              )
              DUB_VERSION_FOR_TEST=$("${curlCmd[@]}" | jq -r '.tag_name | sub("v(?<v>.+)"; .v)')
          else
              DUB_VERSION_FOR_TEST=${{ matrix.dub }}
          fi

          echo "dub path is: `which dub`"
          echo "dub version is: `dub --version`"
          echo "We expect version: $DUB_VERSION_FOR_TEST"

          if [[ "$(dub --version)" =~ "version $DUB_VERSION_FOR_TEST" ]]
          then
              echo "Match"
          else
             exit 1
          fi

      - name : Compile with dub
        run: |
          cd .github && dub run --single hello.d --compiler=${DC}
